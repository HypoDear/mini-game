<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="开源小游戏合集 · 纯静态、零依赖、开箱即玩">
<meta name="theme-color" content="#f4efe4">
<title>mini-game · 小游戏合集</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27><rect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23f4efe4%27/><g fill=%27%231f6f8b%27><rect x=%275.5%27 y=%275.5%27 width=%279.5%27 height=%279.5%27 rx=%272.5%27/><rect x=%2717%27 y=%275.5%27 width=%279.5%27 height=%279.5%27 rx=%272.5%27/><rect x=%275.5%27 y=%2717%27 width=%279.5%27 height=%279.5%27 rx=%272.5%27/><rect x=%2717%27 y=%2717%27 width=%279.5%27 height=%279.5%27 rx=%272.5%27/></g></svg>">
<style>
:root{
  --paper:#f4efe4; --paper2:#fbf8f1; --ink:#2f2a24; --ink-soft:#8c8275;
  --line:#d8cfbe; --accent:#1f6f8b; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Kaiti SC","STKaiti",KaiTi,"Noto Serif SC","Songti SC",Georgia,"Times New Roman",serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));
}
.wrap{width:100%;max-width:460px}
header{text-align:center;margin-bottom:26px}
h1{font-size:26px;letter-spacing:6px;margin:0 0 8px}
header p{margin:0;color:var(--ink-soft);font-size:13px;letter-spacing:1px}
.list{display:flex;flex-direction:column;gap:10px}
.card{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  text-decoration:none;color:inherit;
  background:var(--paper2);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;transition:transform .15s,box-shadow .15s;
}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(47,42,36,.08)}
.card h2{margin:0;font-size:16px;letter-spacing:2px;flex:none}
.card p{margin:0;font-size:12px;color:var(--ink-soft);text-align:right}
footer{margin-top:28px;text-align:center;font-size:11px;color:var(--ink-soft);letter-spacing:.5px}
footer a{color:var(--ink-soft)}
@media(max-width:360px){
  .card{flex-direction:column;align-items:flex-start;gap:5px}
  .card p{text-align:left}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>小游戏合集</h1>
    <p>纯静态 · 零依赖 · 开箱即玩</p>
  </header>
  <div class="list">
    <a class="card" href="sudoku/">
      <h2>数独</h2>
      <p>按解题技巧分级，每局纯逻辑可解</p>
    </a>
    <a class="card" href="gomoku/">
      <h2>五子棋</h2>
      <p>三档 AI 对手，可开启禁手规则</p>
    </a>
    <a class="card" href="llk/">
      <h2>连连看</h2>
      <p>汉字牌面，卡住自动重排不会死局</p>
    </a>
    <a class="card" href="xiangqi/">
      <h2>中国象棋</h2>
      <p>双人对战与三档 AI，含残局闯关</p>
    </a>
  </div>
  <footer>
    <a href="https://github.com/HypoDear/mini-game">在 GitHub 上查看源码</a>
  </footer>
</div>
</body>
</html>
