<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="开源小游戏合集 · 纯静态、零依赖、开箱即玩">
<meta name="theme-color" content="#f4efe4">
<title>mini-game · 小游戏合集</title>
<style>
:root{
  --paper:#f4efe4; --paper2:#fbf8f1; --ink:#2f2a24; --ink-soft:#8c8275;
  --line:#d8cfbe; --accent:#1f6f8b; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Noto Serif SC","Songti SC",Georgia,"Times New Roman",serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));
}
.wrap{width:100%;max-width:520px}
header{text-align:center;margin-bottom:28px}
h1{font-size:26px;letter-spacing:6px;margin:0 0 8px}
header p{margin:0;color:var(--ink-soft);font-size:13px;letter-spacing:1px}
.list{display:flex;flex-direction:column;gap:12px}
.card{
  display:block;text-decoration:none;color:inherit;
  background:var(--paper2);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;transition:transform .15s,box-shadow .15s;
}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(47,42,36,.08)}
.card h2{margin:0 0 6px;font-size:17px;letter-spacing:2px}
.card p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.7}
footer{margin-top:30px;text-align:center;font-size:11px;color:var(--ink-soft);letter-spacing:.5px}
footer a{color:var(--ink-soft)}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>小游戏合集</h1>
    <p>纯静态 · 零依赖 · 开箱即玩</p>
  </header>
  <div class="list">
    <a class="card" href="sudoku/">
      <h2>数独</h2>
      <p>按解题技巧分级难度，而非挖空数量。每局保证纯逻辑可解，永不需要猜测。</p>
    </a>
  </div>
  <footer>
    <a href="https://github.com/HypoDear/mini-game">在 GitHub 上查看源码</a>
  </footer>
</div>
</body>
</html>
