<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="连连看，汉字牌面，保证全程可解，单文件零依赖">
<meta name="theme-color" content="#f4efe4">
<title>连连看</title>
<style>
:root{
  --paper:#f4efe4; --paper2:#fbf8f1; --ink:#2f2a24; --ink-soft:#8c8275;
  --line:#d8cfbe; --tile:#fdfbf6; --tile-edge:#c9bda6; --sel:#e8dcc2;
  --accent:#1f6f8b; --accent-soft:#dceaf0; --bad:#c0463c;
  --good:#2e7d5b; --gold:#b08422; --radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Noto Serif SC","Songti SC",Georgia,"Times New Roman",serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));
  overscroll-behavior:none; touch-action:manipulation;
}
.wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:9px}
.seg{display:flex;background:var(--paper2);border:1px solid var(--line);
  border-radius:var(--radius);padding:3px;gap:3px}
.seg button{flex:1;border:none;background:transparent;border-radius:7px;
  padding:8px 2px;cursor:pointer;color:var(--ink-soft);font-family:inherit;
  display:flex;align-items:baseline;justify-content:center;gap:4px;
  white-space:nowrap;transition:background .15s,color .15s}
.seg button span{font-size:13px;font-weight:600;letter-spacing:.5px}
.seg button i{font-style:normal;font-size:10.5px;opacity:.7}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:12px;color:var(--ink-soft);min-height:22px}
.bar b{color:var(--ink);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:6px;flex:none}
.tools button{border:1px solid var(--line);background:var(--paper2);color:var(--ink);
  border-radius:999px;padding:5px 11px;font:600 11.5px/1 inherit;cursor:pointer}
.tools button:active{background:#ece3d2}

.board-box{position:relative;width:100%;border-radius:8px;background:var(--paper2);
  border:1px solid var(--line);padding:6px;box-shadow:0 2px 10px rgba(47,42,36,.08)}
.grid{position:relative;width:100%}
.tile{position:absolute;display:flex;align-items:center;justify-content:center;
  border-radius:7px;cursor:pointer;user-select:none;color:var(--ink);
  font-family:"Kaiti SC","STKaiti",KaiTi,"Noto Serif SC","Songti SC",serif;
  font-weight:600;letter-spacing:0;
  text-shadow:0 1px 0 rgba(255,255,255,.85),0 -.5px .5px rgba(47,42,36,.18);
  background:
    radial-gradient(circle at 50% 50%,rgba(176,132,34,.07) 0 38%,transparent 39%),
    linear-gradient(160deg,#fffdf8 0%,var(--tile) 52%,#f1e9d9 100%);
  border:1px solid var(--tile-edge);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -1.5px 0 rgba(140,124,96,.22),
    inset 1px 0 0 rgba(255,255,255,.5),
    inset -1px 0 0 rgba(140,124,96,.1),
    0 2.5px 3px rgba(47,42,36,.17),
    0 1px 1px rgba(47,42,36,.1);
  transition:transform .14s cubic-bezier(.34,1.56,.64,1),box-shadow .14s,opacity .2s;
  will-change:transform;
}
.tile::before{
  content:'';position:absolute;inset:3px;border-radius:4px;pointer-events:none;
  border:1px solid rgba(176,132,34,.2);
}
.tile::after{
  content:'';position:absolute;inset:0;border-radius:7px;pointer-events:none;
  background:
    linear-gradient(135deg,rgba(176,132,34,.14) 0 1.5px,transparent 1.5px) left 4px top 4px/7px 7px no-repeat,
    linear-gradient(225deg,rgba(176,132,34,.14) 0 1.5px,transparent 1.5px) right 4px top 4px/7px 7px no-repeat,
    linear-gradient(45deg,rgba(176,132,34,.14) 0 1.5px,transparent 1.5px) left 4px bottom 4px/7px 7px no-repeat,
    linear-gradient(315deg,rgba(176,132,34,.14) 0 1.5px,transparent 1.5px) right 4px bottom 4px/7px 7px no-repeat;
}
.tile:active{transform:translateY(1px) scale(.97)}
.tile.on{
  transform:translateY(-5px) scale(1.07);
  background:
    radial-gradient(circle at 50% 50%,rgba(176,132,34,.1) 0 38%,transparent 39%),
    linear-gradient(160deg,#fdf6e3 0%,var(--sel) 55%,#dfd0ae 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 0 -1.5px 0 rgba(120,102,70,.28),
    0 8px 12px rgba(47,42,36,.26),
    0 2px 4px rgba(47,42,36,.16),
    0 0 0 2px var(--ink) inset;
  z-index:3;
}
.tile.gone{animation:vanish .42s cubic-bezier(.3,.8,.4,1) both;pointer-events:none}
@keyframes vanish{
  0%{opacity:1;transform:scale(1) rotate(0)}
  28%{opacity:1;transform:scale(1.16) rotate(-5deg);
      box-shadow:0 0 0 3px rgba(192,70,60,.5),0 6px 14px rgba(47,42,36,.3)}
  100%{opacity:0;transform:scale(.3) rotate(14deg)}
}
.tile.shake{animation:shk .34s}
@keyframes shk{
  0%,100%{transform:translateX(0)}
  18%{transform:translateX(-4px) rotate(-1.5deg)}
  42%{transform:translateX(4px) rotate(1.5deg)}
  66%{transform:translateX(-2.5px) rotate(-.8deg)}
  86%{transform:translateX(2px)}
}
.tile.drop{animation:drp .34s cubic-bezier(.34,1.56,.64,1) both}
@keyframes drp{
  0%{transform:scale(.62) translateY(-6px);opacity:.25}
  62%{transform:scale(1.08) translateY(1px);opacity:1}
  100%{transform:scale(1) translateY(0);opacity:1}
}
#ln{position:absolute;inset:0;pointer-events:none;overflow:visible}
.mask{position:fixed;inset:0;background:rgba(244,239,228,.94);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;
  z-index:9;padding:24px;text-align:center}
.mask.show{display:flex}
.mask h2{margin:0;font-size:26px;letter-spacing:4px;color:var(--good)}
.mask p{margin:0;color:var(--ink-soft);font-size:13px;line-height:1.9}
.mask .mbtn{border:none;background:var(--ink);color:var(--paper);
  border-radius:var(--radius);padding:12px 32px;font:600 14px/1 inherit;
  cursor:pointer;letter-spacing:2px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--ink);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.confetti i{position:absolute;top:-12px;border-radius:1px;animation:fall linear forwards}
@keyframes fall{
  0%{transform:translateY(-10px) rotate(0);opacity:1}
  100%{transform:translateY(102vh) rotate(720deg);opacity:.85}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="seg" id="lvSeg" role="tablist" aria-label="难度选择"></div>
  <div class="bar">
    <span></span>
    <div class="tools"><button id="btnNew">重开</button></div>
  </div>
  <div class="board-box" id="boardBox">
    <div class="grid" id="grid"><svg id="ln"></svg></div>
  </div>
</div>
<div class="mask" id="mask" role="dialog" aria-live="polite"><div id="maskBody"></div></div>

<script>
'use strict';

function makeBoard(rows, cols){
  const R=rows+2, C=cols+2;
  return { rows, cols, R, C, g:new Int16Array(R*C).fill(-1) };
}
const IDX=(b,r,c)=>r*b.C+c;
const inRange=(b,r,c)=>r>=0&&r<b.R&&c>=0&&c<b.C;
const isFree=(b,r,c)=>inRange(b,r,c)&&b.g[IDX(b,r,c)]===-1;

function clearH(b,r,c1,c2){
  const lo=Math.min(c1,c2)+1, hi=Math.max(c1,c2);
  for(let c=lo;c<hi;c++) if(!isFree(b,r,c)) return false;
  return true;
}
function clearV(b,c,r1,r2){
  const lo=Math.min(r1,r2)+1, hi=Math.max(r1,r2);
  for(let r=lo;r<hi;r++) if(!isFree(b,r,c)) return false;
  return true;
}

function findPath(b, r1,c1, r2,c2){
  if(r1===r2 && c1===c2) return null;

  if(r1===r2 && clearH(b,r1,c1,c2)) return [[r1,c1],[r2,c2]];
  if(c1===c2 && clearV(b,c1,r1,r2)) return [[r1,c1],[r2,c2]];

  const k1r=r1, k1c=c2;
  if(isFree(b,k1r,k1c) && clearH(b,r1,c1,k1c) && clearV(b,c2,r1,r2))
    return [[r1,c1],[k1r,k1c],[r2,c2]];
  const k2r=r2, k2c=c1;
  if(isFree(b,k2r,k2c) && clearV(b,c1,r1,r2) && clearH(b,r2,c1,c2))
    return [[r1,c1],[k2r,k2c],[r2,c2]];

  const dirs=[[0,1],[0,-1],[1,0],[-1,0]];
  for(const [dr,dc] of dirs){
    let r=r1+dr, c=c1+dc;
    while(inRange(b,r,c) && isFree(b,r,c)){
      const p=oneTurnPath(b, r,c, r2,c2);
      if(p) return [[r1,c1]].concat(p);
      r+=dr; c+=dc;
    }
  }
  return null;
}

function oneTurnPath(b, r1,c1, r2,c2){
  if(r1===r2 && clearH(b,r1,c1,c2)) return [[r1,c1],[r2,c2]];
  if(c1===c2 && clearV(b,c1,r1,r2)) return [[r1,c1],[r2,c2]];
  const k1r=r1, k1c=c2;
  if(isFree(b,k1r,k1c) && clearH(b,r1,c1,k1c) && clearV(b,c2,r1,r2))
    return [[r1,c1],[k1r,k1c],[r2,c2]];
  const k2r=r2, k2c=c1;
  if(isFree(b,k2r,k2c) && clearV(b,c1,r1,r2) && clearH(b,r2,c1,c2))
    return [[r1,c1],[k2r,k2c],[r2,c2]];
  return null;
}

function findAnyPair(b){
  const byType=new Map();
  for(let r=1;r<=b.rows;r++)for(let c=1;c<=b.cols;c++){
    const v=b.g[IDX(b,r,c)];
    if(v<0)continue;
    if(!byType.has(v))byType.set(v,[]);
    byType.get(v).push([r,c]);
  }
  for(const list of byType.values()){
    for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
      const p=findPath(b, list[i][0],list[i][1], list[j][0],list[j][1]);
      if(p) return {a:list[i], b:list[j], path:p};
    }
  }
  return null;
}

function countLeft(b){
  let n=0;
  for(let r=1;r<=b.rows;r++)for(let c=1;c<=b.cols;c++) if(b.g[IDX(b,r,c)]>=0) n++;
  return n;
}

function generate(b, kinds, rand){
  rand = rand || Math.random;
  const total=b.rows*b.cols;
  if(total%2) throw new Error('格子数必须为偶数');
  const pairs=total/2;
  const pool=[];
  for(let i=0;i<pairs;i++) pool.push(i%kinds, i%kinds);
  for(let i=pool.length-1;i>0;i--){const j=(rand()*(i+1))|0;[pool[i],pool[j]]=[pool[j],pool[i]];}
  let k=0;
  for(let r=1;r<=b.rows;r++)for(let c=1;c<=b.cols;c++) b.g[IDX(b,r,c)]=pool[k++];
  return b;
}

function collect(b){
  const out=[];
  for(let r=1;r<=b.rows;r++)for(let c=1;c<=b.cols;c++){
    const v=b.g[IDX(b,r,c)];
    if(v>=0) out.push(v);
  }
  return out;
}
function place(b, vals){
  let k=0;
  for(let r=1;r<=b.rows;r++)for(let c=1;c<=b.cols;c++){
    b.g[IDX(b,r,c)] = k<vals.length ? vals[k++] : -1;
  }
}

function reshuffle(b, rand){
  rand = rand || Math.random;
  const vals = collect(b);
  if(vals.length===0) return true;
  for(let attempt=0; attempt<200; attempt++){
    const cp = vals.slice();
    for(let i=cp.length-1;i>0;i--){const j=(rand()*(i+1))|0;[cp[i],cp[j]]=[cp[j],cp[i]];}
    const nb = makeBoard(b.rows, b.cols);
    place(nb, cp);
    if(findAnyPair(nb)) { place(b, cp); return true; }
  }
  const cp = vals.slice().sort((x,y)=>x-y);
  place(b, cp);
  return !!findAnyPair(b);
}

function collapse(b){
  const pts=[];
  for(let r=1;r<=b.rows;r++)for(let c=1;c<=b.cols;c++){
    const v=b.g[IDX(b,r,c)];
    if(v>=0) pts.push([r,c,v]);
  }
  if(!pts.length) return;
  for(const [r,c] of pts) b.g[IDX(b,r,c)]=-1;
  let i=0;
  for(let r=1;r<=b.rows && i<pts.length;r++){
    for(let c=1;c<=b.cols && i<pts.length;c++){
      b.g[IDX(b,r,c)] = pts[i][2];
      i++;
    }
  }
}

const TILES='日月山水火木风云雨雷花草竹石金土星辰冰雪江河林海';

const TIERS=[
  {id:'easy',  name:'简单', sub:'8×6',  rows:6,  cols:8,  kinds:12, collapse:false},
  {id:'medium',name:'中等', sub:'10×8', rows:8,  cols:10, kinds:16, collapse:false},
  {id:'hard',  name:'困难', sub:'12×8 收拢', rows:8, cols:12, kinds:18, collapse:true},
];

const REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;

const S={
  tier:TIERS[0],
  board:null,
  sel:null,
  tiles:[],
  busy:false, over:false,
  left:0, reshuffles:0,
  gen:0,
  started:0, elapsed:0, timer:null,
};
const $=id=>document.getElementById(id);
const gridEl=$('grid'), svg=$('ln');

function buildGrid(){
  gridEl.querySelectorAll('.tile').forEach(e=>e.remove());
  const b=S.board;
  S.tiles=Array.from({length:b.R},()=>new Array(b.C).fill(null));
  for(let r=1;r<=b.rows;r++)for(let c=1;c<=b.cols;c++){
    const el=document.createElement('div');
    el.className='tile';
    el.dataset.r=r;el.dataset.c=c;
    el.addEventListener('click',()=>onTile(r,c));
    gridEl.appendChild(el);
    S.tiles[r][c]=el;
  }
}

function layout(){
  const b=S.board;
  const w=gridEl.clientWidth||560;
  const maxH=Math.max(240,(window.innerHeight||700)*0.62);
  let cw=w/b.cols;
  let ch=maxH/b.rows;
  let s=Math.min(cw,ch);
  const totalW=s*b.cols, totalH=s*b.rows;
  gridEl.style.height=totalH+'px';
  if(s<34)s=34;
  for(let r=1;r<=b.rows;r++)for(let c=1;c<=b.cols;c++){
    const el=S.tiles[r][c];if(!el)continue;
    el.style.width=(s-4)+'px';
    el.style.height=(s-4)+'px';
    el.style.left=((c-1)*s+2)+'px';
    el.style.top=((r-1)*s+2)+'px';
    el.style.fontSize=Math.max(15,Math.round(s*0.60))+'px';
  }
  svg.setAttribute('width',totalW);
  svg.setAttribute('height',totalH);
  svg.setAttribute('viewBox','0 0 '+totalW+' '+totalH);
  S.cell=s;
}

function px(r,c){
  const s=S.cell;
  return [(c-1)*s+s/2,(r-1)*s+s/2];
}

const NS='http://www.w3.org/2000/svg';
function drawPath(path){
  svg.innerHTML='';
  if(!path||!path.length)return;
  const pts=path.map(([r,c])=>px(r,c));
  const d=pts.map(p=>p[0]+','+p[1]).join(' ');
  const glow=document.createElementNS(NS,'polyline');
  glow.setAttribute('points',d);
  glow.setAttribute('fill','none');
  glow.setAttribute('stroke','rgba(192,70,60,.22)');
  glow.setAttribute('stroke-width','8');
  glow.setAttribute('stroke-linecap','round');
  glow.setAttribute('stroke-linejoin','round');
  svg.appendChild(glow);
  const poly=document.createElementNS(NS,'polyline');
  poly.setAttribute('points',d);
  poly.setAttribute('fill','none');
  poly.setAttribute('stroke','#c0463c');
  poly.setAttribute('stroke-width','3.2');
  poly.setAttribute('stroke-linecap','round');
  poly.setAttribute('stroke-linejoin','round');
  svg.appendChild(poly);
  let total=0;
  for(let i=1;i<pts.length;i++){
    total+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  }
  if(!REDUCED&&total>0){
    [glow,poly].forEach(el=>{
      el.style.strokeDasharray=total;
      el.style.strokeDashoffset=total;
      el.style.transition='stroke-dashoffset .3s ease-out';
    });
    requestAnimationFrame(()=>{
      glow.style.strokeDashoffset='0';
      poly.style.strokeDashoffset='0';
    });
  }
  pts.forEach((p,i)=>{
    const dot=document.createElementNS(NS,'circle');
    dot.setAttribute('cx',p[0]);dot.setAttribute('cy',p[1]);
    dot.setAttribute('r',i===0||i===pts.length-1?'4.4':'3.4');
    dot.setAttribute('fill','#c0463c');
    if(!REDUCED){
      dot.style.opacity='0';
      dot.style.transition='opacity .16s ease-out';
      setTimeout(()=>{dot.style.opacity='1';},140+i*45);
    }
    svg.appendChild(dot);
  });
}
function clearPath(){svg.innerHTML='';}

function renderTile(r,c){
  if(!S.board||!S.tiles[r])return;
  const v=S.board.g[IDX(S.board,r,c)];
  const el=S.tiles[r][c];
  if(!el)return;
  if(v<0){el.classList.add('gone');el.textContent='';}
  else{el.classList.remove('gone');el.textContent=TILES[v%TILES.length];}
}

function renderAll(){
  const b=S.board;
  for(let r=1;r<=b.rows;r++)for(let c=1;c<=b.cols;c++) renderTile(r,c);
}

const fmt=s=>String((s/60)|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function startTimer(){
  stopTimer();
  S.started=Date.now()-S.elapsed*1000;
  S.timer=setInterval(()=>{if(!S.over)S.elapsed=((Date.now()-S.started)/1000)|0;},1000);
}
function stopTimer(){if(S.timer)clearInterval(S.timer);S.timer=null;}

function onTile(r,c){
  if(S.busy||S.over)return;
  const b=S.board;
  if(!b||!S.tiles[r]||!S.tiles[r][c])return;
  if(b.g[IDX(b,r,c)]<0)return;
  if(S.sel && S.sel[0]===r && S.sel[1]===c){
    S.tiles[r][c].classList.remove('on');
    S.sel=null;clearPath();return;
  }
  if(!S.sel){
    S.sel=[r,c];
    S.tiles[r][c].classList.add('on');
    return;
  }
  const [r0,c0]=S.sel;
  const v0=b.g[IDX(b,r0,c0)], v1=b.g[IDX(b,r,c)];
  if(v0!==v1){
    S.tiles[r0][c0].classList.remove('on');
    S.tiles[r0][c0].classList.add('shake');
    setTimeout(()=>S.tiles[r0]&&S.tiles[r0][c0]&&S.tiles[r0][c0].classList.remove('shake'),320);
    S.sel=[r,c];
    S.tiles[r][c].classList.add('on');
    clearPath();
    return;
  }
  const path=findPath(b,r0,c0,r,c);
  if(!path){
    S.tiles[r0][c0].classList.remove('on');
    [S.tiles[r0][c0],S.tiles[r][c]].forEach(el=>{
      el.classList.add('shake');
      setTimeout(()=>el.classList.remove('shake'),320);
    });
    S.sel=[r,c];
    S.tiles[r][c].classList.add('on');
    clearPath();
    return;
  }
  const my=S.gen;
  S.busy=true;
  S.tiles[r][c].classList.add('on');
  drawPath(path);
  b.g[IDX(b,r0,c0)]=-1;
  b.g[IDX(b,r,c)]=-1;
  S.sel=null;
  S.left-=2;
  setTimeout(()=>{
    if(my!==S.gen)return;
    [[r0,c0],[r,c]].forEach(([tr,tc])=>{
      const el=S.tiles[tr]&&S.tiles[tr][tc];
      if(!el)return;
      el.classList.remove('on');
      el.classList.add('gone');
    });
  },REDUCED?0:330);
  setTimeout(()=>{
    if(my!==S.gen)return;
    clearPath();
    if(S.left<=0){S.busy=false;finish();return;}
    if(S.tier.collapse){
      collapse(b);
      if(findAnyPair(b))afterLayout();
      else doReshuffle();
    }else if(!findAnyPair(b)){
      doReshuffle();
    }
    S.busy=false;
  },REDUCED?0:620);
}

function afterLayout(){
  const b=S.board;
  clearPath();
  S.sel=null;
  for(let r=1;r<=b.rows;r++)for(let c=1;c<=b.cols;c++){
    const el=S.tiles[r]&&S.tiles[r][c];
    if(!el)continue;
    el.classList.remove('gone','on','shake','drop');
    renderTile(r,c);
    if(b.g[IDX(b,r,c)]>=0 && !REDUCED){
      void el.offsetWidth;
      el.classList.add('drop');
    }
  }
}

function doReshuffle(){
  reshuffle(S.board);
  S.reshuffles++;
  S.left=countLeft(S.board);
  afterLayout();
}

function finish(){
  S.over=true;stopTimer();
  confetti(90);
  $('maskBody').innerHTML=
    '<h2>完成</h2>'+
    '<p>'+S.tier.name+' · 用时 '+fmt(S.elapsed)+'<br>重排 '+S.reshuffles+' 次</p>'+
    '<button class="mbtn" id="againBtn">再来一局</button>';
  $('mask').classList.add('show');
  $('againBtn').onclick=()=>{$('mask').classList.remove('show');newGame(S.tier);};
}

const CONFETTI_COLORS=['#c0463c','#2e7d5b','#1f6f8b','#b08422','#8c5a9e','#d98032'];
function confetti(n){
  if(REDUCED)return;
  const box=document.createElement('div');
  box.className='confetti';
  for(let i=0;i<n;i++){
    const p=document.createElement('i');
    const w=5+Math.random()*6;
    p.style.left=Math.random()*100+'vw';
    p.style.width=w+'px';
    p.style.height=(w*1.5)+'px';
    p.style.background=CONFETTI_COLORS[(Math.random()*CONFETTI_COLORS.length)|0];
    p.style.animationDuration=(2.1+Math.random()*1.6)+'s';
    p.style.animationDelay=(Math.random()*0.5)+'s';
    p.style.opacity=0.65+Math.random()*0.35;
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(),4200);
}

function buildSeg(){
  const el=$('lvSeg');
  if(!el.children.length){
    TIERS.forEach(t=>{
      const b=document.createElement('button');
      b.innerHTML='<span>'+t.name+'</span><i>'+t.sub+'</i>';
      b.setAttribute('role','tab');
      b.onclick=()=>{ if(t.id!==S.tier.id||confirm('重新开始一局'+t.name+'？')) newGame(t); };
      el.appendChild(b);
    });
  }
  [...el.children].forEach((b,i)=>{
    const on=TIERS[i].id===S.tier.id;
    b.classList.toggle('on',on);
    b.setAttribute('aria-selected',on?'true':'false');
  });
}

function newGame(tier){
  S.tier=tier;buildSeg();
  $('maskBody').innerHTML='<div class="spin"></div><p>正在生成牌面…</p>';
  $('mask').classList.add('show');
  setTimeout(()=>{
    S.gen++;
    S.over=false;S.busy=false;S.sel=null;S.reshuffles=0;S.elapsed=0;
    const b=makeBoard(tier.rows,tier.cols);
    for(let attempt=0;attempt<100;attempt++){
      generate(b,tier.kinds);
      if(findAnyPair(b))break;
    }
    S.board=b;
    S.left=countLeft(b);
    buildGrid();
    layout();
    clearPath();
    $('mask').classList.remove('show');
    startTimer();
    renderAll();
  },40);
}

$('btnNew').onclick=()=>newGame(S.tier);
window.addEventListener('resize',()=>{ if(S.board){layout();renderAll();} });
document.addEventListener('visibilitychange',()=>{ if(document.hidden)stopTimer(); else if(!S.over)startTimer(); });

newGame(TIERS[0]);
</script>
